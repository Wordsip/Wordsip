<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Histoires — WordSip</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <header class="dashboard-header">
      <div class="logo">🥤 WordSip</div>
      <span id="level-badge" class="badge badge-accent"></span>
    </header>

    <nav style="display:flex;justify-content:center;gap:16px;margin-bottom:16px;font-size:12px;flex-wrap:wrap;">
      <a href="/mot-du-jour" id="nav-mot-link" style="color:#666;">Mon mot</a>
      <a href="/grammaire" id="nav-grammaire-link" style="color:#666;">Grammaire</a>
      <a href="/phonetique" id="nav-phonetique-link" style="color:#666;">Phonétique</a>
      <a href="/dictee" id="nav-dictee-link" style="color:#666;">Dictée</a>
      <a href="/histoire" style="color:#2b7a78;font-weight:600;">Histoires</a>
    </nav>

    <h2 style="text-align:center;margin-bottom:6px;">📖 Histoires</h2>
    <p style="text-align:center;font-size:13px;color:#666;margin-bottom:6px;">Chaque histoire utilise des mots de ton niveau — elle s'ouvre quand tu en connais la moitié (la première est toujours ouverte)</p>
    <p id="stories-summary" style="text-align:center;font-size:12px;color:#2b7a78;font-weight:600;margin-bottom:18px;"></p>

    <div id="loading">Chargement...</div>

    <div id="locked-content" style="display:none;">
      <div class="info-card">
        <p class="info-title" id="locked-title"></p>
        <p id="locked-message"></p>
      </div>
    </div>

    <div id="story-list" style="display:none;"></div>
    <p id="audio-note" style="display:none;text-align:center;font-size:12px;color:#c0392b;margin-top:10px;"></p>
  </div>

  <script src="/histoire.js"></script>
</body>
</html>
